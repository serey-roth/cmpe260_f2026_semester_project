[project]
name = "rl-webshop"
version = "0.1.0"
description = "Post-Training a Large Language Model with Reinforcement Learning for Long-Horizon Online Shopping on WebShop Data."
readme = "README.md"
authors = [
    { name = "Serey Roth", email = "serey.roth@sjsu.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cleantext>=1.1.4",
    "en-core-web-sm",
    "faiss-cpu>=1.15.1",
    "flask>=3.1.3",
    "gdown>=6.4.2",
    "gym>=0.26.2",
    "html2text>=2025.4.15",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pandas>=3.0.6",
    "pyserini>=2.4.0",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "spacy>=3.8.16",
    "thefuzz>=0.22.1",
    "torch>=2.14.1",
    "webshop-minimal",
]

[tool.uv.sources]
webshop-minimal = { path = "webshop", editable = true }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pyright]
extraPaths = ["webshop"]
